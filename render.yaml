services:
  - type: web
    name: halong-yield
    runtime: python
    plan: starter            # always on; the free plan sleeps and has no persistent disk
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: agent-data
      mountPath: /var/data   # state + deliverables survive restarts and deploys
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PUBLIC_BASE_URL
        value: https://halong-yield.onrender.com
      - key: AGENT_ID
        value: "2647"
      - key: DATA_DIR
        value: /var/data
      - key: RPC_URL
        value: https://bsc-testnet-rpc.publicnode.com
      - key: MAINNET_RPC_URL
        value: https://bsc-rpc.publicnode.com
      - key: AGENT_PRIVATE_KEY   # the agent's operating wallet, set in the Render dashboard
        sync: false
      - key: WALLET_PASSWORD
        generateValue: true
