name: tick
# Every 10 minutes: deliver funded ERC-8183 jobs, settle jobs past the dispute window,
# claim ended HelloFugu subscriptions.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-wallet        # shared with cycle.yml: one agent-wallet writer at a time
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.worker tick
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          STORAGE_API_KEY: ${{ secrets.STORAGE_API_KEY }}
          STORAGE_GATEWAY_URL: ${{ vars.STORAGE_GATEWAY_URL }}
          AGENT_ID: "2647"
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://halong-yield.vercel.app' }}
