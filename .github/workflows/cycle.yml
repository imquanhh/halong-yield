name: treasury cycle
# Twice a day: one Venus treasury cycle (rank on mainnet, supply the leader, rotate out of laggards).
on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

concurrency:
  group: agent-wallet        # shared with tick.yml: one agent-wallet writer at a time
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.worker cycle
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          AGENT_ID: "2647"
